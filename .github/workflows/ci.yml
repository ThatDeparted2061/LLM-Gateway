name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "Run gofmt on:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /dev/null ./cmd/gateway

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Publish on pushes to main and v* tags, once Docker Hub is configured:
      #   repo variable DOCKERHUB_USERNAME + repo secret DOCKERHUB_TOKEN.
      PUBLISH: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'local' }}/llm-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: llm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the real image with no reachable provider: it must serve /metrics
      # and report itself down (503) on /health.
      - name: Smoke test
        run: |
          docker run -d --name gw -p 8080:8080 -e SEMANTIC_CACHE=false llm-gateway:ci
          for _ in $(seq 1 30); do curl -sf localhost:8080/metrics >/dev/null && break; sleep 0.5; done
          curl -sf localhost:8080/metrics | grep -q '^go_goroutines'
          code=$(curl -s -o health.json -w '%{http_code}' localhost:8080/health)
          cat health.json; docker logs gw
          [ "$code" = 503 ]

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish status
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "Pushed: ${{ steps.meta.outputs.tags }}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Image built and smoke-tested; not pushed (pull request, or Docker Hub not configured)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

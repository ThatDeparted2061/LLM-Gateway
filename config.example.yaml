# Copy to config.yaml (git-ignored) and edit. Every value can also be set with
# the env var in the trailing comment; env vars win over this file.

port: 8080                          # GATEWAY_PORT

# groq | gemini | ollama. Every other configured provider becomes a fallback,
# tried in the order groq -> gemini -> ollama.
primary_provider: groq              # PRIMARY_PROVIDER

# Client keys allowed to call the gateway (Authorization: Bearer <key>).
# Empty list = open access (any key, or none, is accepted and rate limited per key).
api_keys: []                        # GATEWAY_API_KEYS (comma-separated)

groq:
  api_key: ""                       # GROQ_API_KEY
  model: llama-3.1-8b-instant       # GROQ_MODEL

gemini:
  api_key: ""                       # GEMINI_API_KEY
  model: gemini-2.5-flash           # GEMINI_MODEL

ollama:
  base_url: http://localhost:11434  # OLLAMA_BASE_URL
  model: llama3.2                   # OLLAMA_MODEL

cache:
  ttl: 1h                           # CACHE_TTL (exact and semantic entries)
  semantic: true                    # SEMANTIC_CACHE
  similarity_threshold: 0.95        # SIMILARITY_THRESHOLD (cosine, 0-1]
  embedding_model: nomic-embed-text # EMBEDDING_MODEL (served by Ollama)

rate_limit:                         # per API key; each request costs one token
  tokens_per_sec: 5                 # RATE_LIMIT_TPS
  burst: 10                         # RATE_LIMIT_BURST
